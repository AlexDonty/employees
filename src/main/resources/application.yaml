spring:
  application:
    name: employees
  spring:
    datasource:
      url: jdbc:mysql://localhost:3306/employees_db
      username: app_user
      password: app_pass
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: 'true'
    hibernate:
      ddl-auto: update
    show-sql: 'true'
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always